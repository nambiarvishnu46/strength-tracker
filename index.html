<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Strength Tracker</title>

<!-- iPhone / Safari "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Strength" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#121214" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">&#128170;</div>
    <h1 class="login-title">Strength Tracker</h1>
    <p class="login-sub">Set up your profile with a username. No password needed &mdash; just pick a name to track your own workouts, history and progress.</p>
    <input type="text" id="loginUsernameInput" class="login-input" placeholder="Enter a username" autocomplete="off" autocapitalize="off" />
    <button class="btn-primary" id="loginContinueBtn">Continue</button>
    <div id="loginProfileList" class="login-profile-list"></div>
    <button class="login-cancel" id="loginCancelBtn" style="display:none;">Cancel</button>
  </div>
</div>

<header class="topbar">
  <div class="topbar-row">
    <div>
      <div class="topbar-title" id="topbarTitle">Strength Tracker</div>
      <div class="topbar-sub" id="topbarSub"></div>
    </div>
    <div class="topbar-right">
      <div class="topbar-timer" id="topbarTimer" style="display:none;"></div>
      <button class="profile-chip" id="profileChipBtn"></button>
    </div>
  </div>
</header>

<main id="app"></main>

<nav class="tabbar">
  <button class="tab-btn active" data-tab="today">
    <span class="tab-icon">&#9679;</span><span>Today</span>
  </button>
  <button class="tab-btn" data-tab="program">
    <span class="tab-icon">&#9776;</span><span>Routines</span>
  </button>
  <button class="tab-btn" data-tab="history">
    <span class="tab-icon">&#128336;</span><span>History</span>
  </button>
  <button class="tab-btn" data-tab="progress">
    <span class="tab-icon">&#128200;</span><span>Progress</span>
  </button>
</nav>

<script src="program.js"></script>
<script src="app.js"></script>
</body>
</html>
